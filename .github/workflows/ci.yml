name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API contract tests
        run: pytest

  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run ML pipeline directly
        env:
          MLFLOW_TRACKING_URI: http://127.0.0.1:5000
          MLFLOW_REGISTRY_URI: http://127.0.0.1:5000
          MODEL_NAME: deliveryrisk-late-order
        run: |
          python -m pipelines.ingest
          python -m pipelines.validate
          python -m pipelines.features
          python -m pipelines.train