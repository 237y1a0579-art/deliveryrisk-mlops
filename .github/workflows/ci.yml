name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit and API contract tests
        run: pytest

  pipeline-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pathspec==1.1.1" --force-reinstall
          pip install "dvc==3.59.0" --force-reinstall
          pip install -r requirements.txt
          pip install "pathspec==1.1.1" --force-reinstall
      - name: Run reproducible ML pipeline
        run: dvc repro