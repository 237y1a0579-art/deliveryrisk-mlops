name: Build Images

on:
  push:
    branches: [main]
    paths:
      - "services/**"
      - "requirements.txt"
      - "pipelines/**"
      - "scripts/update_kustomize_image.py"
      - ".github/workflows/cd.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}

jobs:
  build-and-promote-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_TAG: app-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release helper dependencies
        run: pip install PyYAML==6.0.2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api:latest

      - name: Build and push drift image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/monitoring/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/drift:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/drift:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: services/frontend
          file: services/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend:latest

      - name: Update dev GitOps image tags
        run: |
          python scripts/update_kustomize_image.py --file k8s/overlays/dev/kustomization.yaml --service api --new-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/api --new-tag ${{ env.IMAGE_TAG }}
          python scripts/update_kustomize_image.py --file k8s/overlays/dev/kustomization.yaml --service drift --new-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/drift --new-tag ${{ env.IMAGE_TAG }}
          python scripts/update_kustomize_image.py --file k8s/overlays/dev/kustomization.yaml --service frontend --new-name ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/frontend --new-tag ${{ env.IMAGE_TAG }}

      - name: Commit GitOps deployment update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: deploy app images ${{ env.IMAGE_TAG }}"
          git push
