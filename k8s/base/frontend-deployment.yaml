apiVersion: apps/v1
kind: Deployment
metadata:
  name: deliveryrisk-frontend
  namespace: deliveryrisk
  labels:
    app: deliveryrisk-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deliveryrisk-frontend
  template:
    metadata:
      labels:
        app: deliveryrisk-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/REPO/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

