apiVersion: apps/v1
kind: Deployment
metadata:
  name: deliveryrisk-api
  namespace: deliveryrisk
  labels:
    app: deliveryrisk-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: deliveryrisk-api
  template:
    metadata:
      labels:
        app: deliveryrisk-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_PATH
              value: /app/models/champion.joblib
            - name: INFERENCE_LOG_PATH
              value: /app/data/production/inference_log.csv
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20

