apiVersion: apps/v1
kind: Deployment
metadata:
  name: deliveryrisk-drift
  namespace: deliveryrisk
  labels:
    app: deliveryrisk-drift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deliveryrisk-drift
  template:
    metadata:
      labels:
        app: deliveryrisk-drift
    spec:
      containers:
        - name: drift
          image: ghcr.io/OWNER/REPO/drift:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8010
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10

