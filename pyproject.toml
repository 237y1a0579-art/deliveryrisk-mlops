[project]
name = "deliveryrisk-mlops"
version = "0.1.0"
description = "End-to-end production-style MLOps project for late delivery risk prediction."
requires-python = ">=3.10,<3.13"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

